# CI: everything except P1 (p1-enforcement.yml) and fuzzing (folio-fuzz.yml).
#
# rust: fmt, clippy (native + wasm32), tests including the Kernel's Postgres
#       store, and the committed FlatBuffers bindings regenerated with the
#       pinned flatc.
# ts:   token outputs fresh, then turbo typecheck/test/build. The Lumen tests
#       drive real WebGL2 (SwiftShader), the Compositor's wasm build and the
#       Kernel binary from headless Chromium.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  rust:
    name: Rust · fmt, clippy, test, generated code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kernel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SANAD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kernel_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (native, all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Clippy (wasm32 client crates)
        run: cargo clippy -p sanad-compositor -p sanad-folio -p sanad-tokens --lib --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Test (including the Kernel's Postgres store)
        run: cargo test --workspace --all-features --locked

      - name: Folio bindings match the schema (pinned flatc)
        env:
          # sha256 of Linux.flatc.binary.clang++-18.zip for tools/flatc.version
          FLATC_ZIP_SHA256: 50c1915deeeb714f2a05c8ec795bd1af898d251a62e2774067703b29188efc90
        run: |
          version="$(cat tools/flatc.version)"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/flatc.zip" \
            "https://github.com/google/flatbuffers/releases/download/v${version}/Linux.flatc.binary.clang++-18.zip"
          echo "${FLATC_ZIP_SHA256}  $RUNNER_TEMP/flatc.zip" | sha256sum --check --strict -
          unzip -q -o "$RUNNER_TEMP/flatc.zip" -d "$RUNNER_TEMP/flatc"
          FLATC="$RUNNER_TEMP/flatc/flatc" tools/gen-folio.sh
          git diff --exit-code -- crates/folio/src/folio_generated.rs

  ts:
    name: TS · tokens, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the pinned Rust toolchain (wasm32 target included)
        run: rustup toolchain install

      - name: Install wasm-bindgen-cli (must equal the crate pin)
        run: |
          version="$(grep -E '^wasm-bindgen = ' Cargo.toml | sed -E 's/.*"=([0-9.]+)".*/\1/')"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @sanad/lumen exec playwright install --with-deps chromium

      - name: Committed Rust theme uniforms match tokens.json
        run: pnpm --filter @sanad/tokens run check

      - name: Typecheck, test, build
        run: pnpm exec turbo run typecheck test build
