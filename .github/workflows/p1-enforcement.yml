# P1 — "Protected text never exists as Unicode on the client."
#
# Fails the PR if any canary phrase from fixtures/canary/canaries.json (or any
# 4-word shingle of one) is observed in the built reader or in the running
# reader's DOM, accessibility tree, storage, network traffic, console, V8 heaps
# or raw browser-process memory.
#
# Order matters: the harness first proves it can still see planted leaks
# (negative controls). A harness that went blind would otherwise certify
# violations as clean.
name: P1 enforcement

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared by the runner user (install) and root (scan): the memory sweep reads
  # /proc/<pid>/mem of the browser, which needs CAP_SYS_PTRACE.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  p1:
    name: P1 · no client plaintext
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the harness
        run: pnpm --filter @sanad/p1-harness exec playwright install --with-deps chromium

      - name: Harness unit tests and typecheck
        run: |
          pnpm --filter @sanad/p1-harness run test
          pnpm --filter @sanad/p1-harness run typecheck

      - name: Build reader (production)
        run: pnpm exec turbo run build --filter=@sanad/reader

      - name: Negative controls — harness must detect every planted leak
        run: >-
          sudo --preserve-env=PLAYWRIGHT_BROWSERS_PATH,CI
          "$(command -v node)" tools/p1-harness/src/cli.ts selftest
          --proc-mem require
          --out tools/p1-harness/out

      - name: P1 scan of the reader
        run: >-
          sudo --preserve-env=PLAYWRIGHT_BROWSERS_PATH,CI
          "$(command -v node)" tools/p1-harness/src/cli.ts scan
          --config tools/p1-harness/p1.config.json
          --proc-mem require

      - name: Upload P1 report and HAR files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p1-report
          path: |
            tools/p1-harness/out/*.json
            tools/p1-harness/out/*.har
          retention-days: 14
          if-no-files-found: warn
