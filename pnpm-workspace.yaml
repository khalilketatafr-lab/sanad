# Sanad JS/TS workspace. The Rust side lives in the Cargo workspace (Cargo.toml).
packages:
  - apps/*
  - packages/*
  - tools/*

# pnpm 10 blocks dependency lifecycle scripts by default; allow only what we audit.
onlyBuiltDependencies:
  - esbuild

# Fail installs on a lockfile/manifest mismatch instead of silently re-resolving.
strictPeerDependencies: true

# One version of every shared dependency across the monorepo.
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  react-aria-components: 1.21.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/node": 22.20.4
  vite: 8.3.2
  "@vitejs/plugin-react": 6.1.1
  typescript: 6.0.3
  playwright: 1.56.1
  esbuild: 0.28.2
  style-dictionary: 5.5.5
