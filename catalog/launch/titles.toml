# Sanad launch catalog: the first 50 titles (roadmap §10.7).
#
# Schema, rights rules and statuses: README.md beside this file. Validated by
# `cargo test -p sanad-atelier --test launch_catalog`. Every source below was
# checked when it was listed: Standard Ebooks URLs resolve, Gutenberg numbers
# match the Gutenberg catalog (title, language, contributors), and Wikisource
# pages exist (completeness noted where partial).

schema = 1
rights_as_of = 2026

